name: Build plugin and launcher

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Paper plugin
        run: mvn -B package

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-plugin-jar
          path: server-plugin/target/*.jar

  build-launcher-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run dist:win

      - name: Upload launcher exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-exe
          path: launcher/dist/*.exe
